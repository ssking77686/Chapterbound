[package]
name = "电子阅读器"
version = "1.3.2"
description = "沉浸式 EPUB 电子书阅读器"
authors = ["ahine Yang"]
license = "MIT"
repository = "https://github.com/ssking77686/e-reader"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
